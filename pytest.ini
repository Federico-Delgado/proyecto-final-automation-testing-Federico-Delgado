# pytest.ini
[pytest]
# Opciones por defecto
addopts = -v --html=reports/reporte_final.html --self-contained-html

# Metadatos del reporte
html_report_title = Proyecto Final Automation Testing - Federico Delgado
html_report_description = Suite completa de pruebas UI (SauceDemo) y API (JSONPlaceholder)

# Definición de markers para evitar warnings
markers =
    smoke: pruebas críticas y rápidas
    ui: pruebas de interfaz de usuario
    api: pruebas de servicios REST
    regression: suite completa de regresión
    e2e: pruebas de flujo completo (end-to-end)